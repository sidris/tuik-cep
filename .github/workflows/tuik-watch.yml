name: TÜİK izleyici

on:
  schedule:
    # Yoğun pencere: hafta içi 10:30 TR'ye kadar 15 sn'de bir kontrol.
    # GitHub zamanlanmış işleri 1 saate varan gecikmeyle (bazen hiç) başlatıyor; bu yüzden
    # 07:47-09:47 TR arasında dört ayrı tetikleyici var. Hangisi önce başlarsa 10:30'a kadar izler,
    # diğerleri sıraya girip tek kontrol yapar.
    - cron: "47 4 * * 1-5"
    - cron: "17 5 * * 1-5"
    - cron: "47 5 * * 1-5"
    - cron: "17 6 * * 1-5"
    # Günün geri kalanı için yedek kontrol (~10 dk'da bir; GitHub bazen geciktirir).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once | test-push | burst | refresh-extras"
        default: once
      press_id:
        description: "test-push için bülten no (boşsa feed'deki son bülten)"
        default: ""

permissions:
  contents: write

concurrency:
  group: tuik-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPO_PUSH_TOKENS: ${{ secrets.EXPO_PUSH_TOKENS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GIT_COMMIT: "1"
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: watcher/requirements.txt
      - run: pip install -r watcher/requirements.txt
      - name: Türkçe font (PDF için)
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - name: git kimliği
        run: |
          git config user.name "tuik-cep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Çalıştır
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ] && [ "$SCHED" != "*/10 * * * *" ]; then MODE=burst; fi
          case "$MODE" in
            burst)     python watcher/tuik_watcher.py burst --until-utc 07:30 --interval 15 ;;
            test-push) if [ -n "${{ github.event.inputs.press_id }}" ]; then
                         python watcher/tuik_watcher.py test-push --id "${{ github.event.inputs.press_id }}"
                       else
                         python watcher/tuik_watcher.py test-push
                       fi ;;
            refresh-extras) python watcher/tuik_watcher.py refresh-extras ;;
            *)         python watcher/tuik_watcher.py once ;;
          esac
